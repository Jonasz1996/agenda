# Agenda 2.0. Zelfde poort (5269) en zelfde database-container als de oude app: de oude tabel blijft staan,
# de nieuwe app gebruikt eigen tabellen (agenda_events, agenda_settings).
services:
  agenda:
    build: .
    image: agenda:2.0
    container_name: agenda
    restart: unless-stopped
    ports:
      - "5269:5000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://agenda:${POSTGRES_PASSWORD}@agenda-db:5432/agenda
      AGENDA_TZ: Europe/Brussels
      AGENDA_NAME: Agenda
    depends_on:
      agenda-db:
        condition: service_healthy

  agenda-db:
    image: postgres:17
    container_name: agenda-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agenda
      POSTGRES_USER: agenda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenda -d agenda"]
      interval: 5s
      timeout: 5s
      retries: 10
